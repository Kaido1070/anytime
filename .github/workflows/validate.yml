name: Validate Anytime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Block tracked D1 exports and embedded secrets
        run: node scripts/check-tracked-secrets.mjs
      - name: Parallel checks
        shell: bash
        run: |
          set -uo pipefail

          pnpm test > /tmp/tests.log 2>&1 &
          tests_pid=$!

          pnpm build > /tmp/build.log 2>&1 &
          build_pid=$!

          (
            find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          ) > /tmp/functions.log 2>&1 &
          functions_pid=$!

          pnpm check:unused > /tmp/unused.log 2>&1 &
          unused_pid=$!

          status=0
          wait "$tests_pid" || status=1
          wait "$build_pid" || status=1
          wait "$functions_pid" || status=1
          wait "$unused_pid" || status=1

          echo "::group::Tests"
          cat /tmp/tests.log
          echo "::endgroup::"
          echo "::group::Build"
          cat /tmp/build.log
          echo "::endgroup::"
          echo "::group::Pages Function syntax"
          cat /tmp/functions.log
          echo "::endgroup::"

          echo "::group::Unused code"
          cat /tmp/unused.log
          echo "::endgroup::"

          exit "$status"
