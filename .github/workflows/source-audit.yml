name: Audit Source Chapter Completeness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/audit-source-chapters.mjs
      - .github/workflows/source-audit.yml
      - functions/api/source/**

permissions:
  contents: read

concurrency:
  group: source-chapter-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mangatime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Audit MangaTime
        env:
          AUDIT_SOURCE: mangatime
          AUDIT_DELAY_MS: "450"
          AUDIT_CATALOG_MAX_PAGES: "250"
          AUDIT_FAIL_ON_ISSUES: "1"
        run: node scripts/audit-source-chapters.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-mangatime
          path: audit-results/mangatime.json
          if-no-files-found: ignore

  asq:
