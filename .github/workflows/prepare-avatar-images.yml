name: Prepare Wany Avatar Images

on:
  push:
    branches: [main]
    paths:
      - scripts/build-avatar-webp.py
      - .github/workflows/prepare-avatar-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-wany-avatars
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Download and optimize verified portraits
        id: images
        continue-on-error: true
        run: python scripts/build-avatar-webp.py
      - name: Commit available WebP images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars functions/avatar-local-images.js
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized Wany character portrait assets"
            git push
          fi
      - name: Check full catalog
        if: steps.images.outcome != 'success'
        run: |
          echo "::error::Some portraits could not be verified. See public/avatars/manifest.json."
          exit 1
