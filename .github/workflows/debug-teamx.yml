name: Debug TeamX Dimensions

on:
  push:
    branches: [debug-teamx-dimensions]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query production diagnostic endpoint
        run: |
          for i in {1..20}; do
            echo "Attempt $i"
            code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 30 https://anytimee.pages.dev/api/teamx-render-debug || true)
            echo "HTTP $code"
            cat /tmp/out.json || true
            echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          exit 1
