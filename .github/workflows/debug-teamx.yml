name: Debug TeamX Dimensions

on:
  push:
    branches: [debug-teamx-dimensions]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query production diagnostic endpoint
        run: |
          curl -sS -i --max-time 40 https://anytimee.pages.dev/api/teamx-debug || true
