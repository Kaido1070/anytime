name: Probe TeamX Promo

on:
  push:
    paths:
      - ".github/workflows/probe-teamx-promo.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find current Lord of the Truth promo asset
        shell: bash
        run: |
          set -u
          BASE='https://olympustaff.com'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          curl -sS -L -A "$UA" "$BASE/" -o /tmp/home.html || true
          echo '=== likely series links ==='
          grep -oE 'href="[^"]+/series/[^"]+"' /tmp/home.html | head -n 20 || true
          SERIES=$(grep -oE 'href="[^"]+/series/[^"]+"' /tmp/home.html | sed -E 's/^href="//;s/"$//' | head -n 8)
          for s in $SERIES; do
            case "$s" in http*) url="$s";; *) url="$BASE$s";; esac
            echo "=== SERIES $url ==="
            curl -sS -L -A "$UA" "$url" -o /tmp/series.html || continue
            CH=$(grep -oE 'href="[^"]+/series/[^"]+/[0-9]+[^"]*"' /tmp/series.html | sed -E 's/^href="//;s/"$//' | head -n 1)
            [ -n "$CH" ] || continue
            case "$CH" in http*) curlurl="$CH";; *) curlurl="$BASE$CH";; esac
            echo "chapter=$curlurl"
            curl -sS -L -A "$UA" "$curlurl" -o /tmp/chapter.html || continue
            grep -in -E '1280|518|Lord|Truth|Zeus|زيوس|data-src|canvas' /tmp/chapter.html | head -n 60 || true
          done
